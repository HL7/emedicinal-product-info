<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="480" y="28" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">Structured dosing: how the pieces fit (Duosynth example)</text><text x="480" y="47" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">Dosing sits on the indication. Each sub-population is a full Group. Each dose names the tablet it is taken from.</text><rect x="30" y="70" width="220" height="62" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="140.0" y="90" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">MedicinalProductDefinition</text><text x="140.0" y="107" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Duosynth film-coated tablets</text><rect x="330" y="64" width="300" height="74" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="480" y="88" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">ClinicalUseDefinition (indication)</text><text x="480" y="106" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">Mild-to-moderate COVID-19, high risk</text><text x="480" y="123" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">population → Adults</text><rect x="710" y="70" width="220" height="62" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><text x="820.0" y="90" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Group: Adults</text><text x="820.0" y="107" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">age 18 years or over</text><path d="M 330 101 L 252 101" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#mg)"/><text x="291" y="94" font-size="10.5" font-weight="600" fill="#16a34a" text-anchor="middle">subject</text><path d="M 630 101 L 708 101" fill="none" stroke="#0891b2" stroke-width="1.6" marker-end="url(#mc)"/><text x="669" y="94" font-size="10.5" font-weight="600" fill="#0891b2" text-anchor="middle">population</text><text x="480" y="160" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">indication.extension[dosingGuideline] × 3, one per sub-population</text><rect x="30" y="176" width="280" height="320" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="44" y="198" font-size="12.5" font-weight="800" fill="#7c3aed" text-anchor="start">Dosing guideline</text><rect x="42" y="208" width="256" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="52" y="227" font-size="10.5" font-weight="700" fill="#0e7490" text-anchor="start">population →</text><text x="126" y="227" font-size="10.5" font-weight="400" fill="#0e7490" text-anchor="start">adults AND eGFR ≥ 60 mL/min</text><rect x="42" y="250" width="256" height="122" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/><text x="52" y="268" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start">dosage · type: Days 1 to 5</text><text x="288" y="268" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">sequence 1</text><rect x="52" y="278" width="236" height="30" rx="6" fill="#fff" stroke="#db2777" stroke-width="1.2"/><circle cx="66" cy="293" r="6" fill="#db2777"/><text x="78" y="297" font-size="11" font-weight="700" fill="#