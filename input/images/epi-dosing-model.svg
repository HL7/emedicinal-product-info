 stroke-width="1.2"/><circle cx="376" cy="329" r="6" fill="#475569"/><text x="388" y="333" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">100 mg boostavir</text><text x="590" y="333" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">(one 100 mg)</text><text x="480.0" y="364" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">twice daily for 5 days</text><rect x="650" y="176" width="280" height="320" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.6"/><text x="664" y="198" font-size="12.5" font-weight="800" fill="#7c3aed" text-anchor="start">Dosing guideline</text><rect x="662" y="208" width="256" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/><text x="672" y="227" font-size="10.5" font-weight="700" fill="#0e7490" text-anchor="start">population →</text><text x="746" y="227" font-size="10.5" font-weight="400" fill="#0e7490" text-anchor="start">adults AND eGFR &lt; 30 mL/min</text><rect x="662" y="250" width="256" height="116" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/><text x="672" y="268" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start">dosage · type: Day 1</text><text x="908" y="268" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">sequence 1</text><rect x="672" y="278" width="236" height="30" rx="6" fill="#fff" stroke="#db2777" stroke-width="1.2"/><circle cx="686" cy="293" r="6" fill="#db2777"/><text x="698" y="297" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">300 mg synthavir</text><text x="900" y="297" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">(two 150 mg)</text><rect x="672" y="314" width="236" height="30" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/><circle cx="686" cy="329" r="6" fill="#475569"/><text x="698" y="333" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">100 mg boostavir</text><text x="900" y="333" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">(one 100 mg)</text><text x="790.0" y="358" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">once</text><rect x="662" y="374" width="256" height="116" rx="6" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1"/><text x="672" y="392" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="start">dosage · type: Days 2 to 5</text><text x="908" y="392" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="end">sequence 2</text><rect x="672" y="402" width="236" height="30" rx="6" fill="#fff" stroke="#db2777" stroke-width="1.2"/><circle cx="686" cy="417" r="6" fill="#db2777"/><text x="698" y="421" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">150 mg synthavir</text><text x="900" y="421" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">(one 150 mg)</text><rect x="672" y="438" width="236" height="30" rx="6" fill="#fff" stroke="#475569" stroke-width="1.2"/><circle cx="686" cy="453" r="6" fill="#475569"/><text x="698" y="457" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">100 mg boostavir</text><text x="900" y="457" font-size="10.5" font-weight="400" fill="#475569" text-anchor="end">(one 100 mg)</text><text x="790.0" y="482" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">once daily</text><path d="M 480 138 L 480 166 L 170 166 L 170 174" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mv)"/><path d="M 480 138 L 480 166 L 480 166 L 480 174" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mv)"/><path d="M 480 138 L 480 166 L 790 166 L 790 174" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mv)"/><rect x="30" y="520" width="900" height="150" rx="10" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="48" y="542" font-size="12.5" font-weight="800" fill="#16a34a" text-anchor="start">PackagedProductDefinition: carton of 5 daily blister cards</text><text x="48" y="560" font-size="11" font-weight="400" fill="#475569" text-anchor="start">each card: 4 synthavir tablets + 2 boostavir tablets (morning and evening marked)</text><rect x="150" y="578" width="300" height="72" rx="8" fill="#fff" stroke="#db2777" stroke-width="2"/><circle cx="172" cy="600" r="7" fill="#db2777"/><text x="186" y="604" font-size="12" font-weight="800" fill="#0f172a" text-anchor="start">ManufacturedItemDefinition</text><text x="172" y="624" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">synthavir 150 mg film-coated tablet,</text><text x="172" y="639" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">pink · 4 per card</text><rect x="510" y="578" width="300" height="72" rx="8" fill="#fff" stroke="#475569" stroke-width="2"/><circle cx="532" cy="600" r="7" fill="#475569"/><text x="546" y="604" font-size="12" font-weight="800" fill="#0f172a" text-anchor="start">ManufacturedItemDefinition</text><text x="532" y="624" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">boostavir 100 mg film-coated tablet,</text><text x="532" y="639" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start">white · 2 per card</text><rect x="160" y="503" width="640" height="22" rx="4" fill="#fff" stroke="#fff" stroke-width="0"/><text x="480" y="518" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">● each dose carries the Dosage Manufactured Item extension, pointing to the tablet it is taken from</text><text x="480" y="690" font-size="10.5" font-weight="400" fill="#94a3b8" text-anchor="middle" font-style="italic">Doses that share a sequence are taken together. The authorised wording always stays in Dosage.text.</text></svg>