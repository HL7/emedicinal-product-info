<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="480" y="28" font-size="17" font-weight="800" fill="#0f172a" text-anchor="middle">The life of a label</text><text x="480" y="47" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">One ePI, from first draft to approved content reused everywhere</text><rect x="20" y="64" width="920" height="138" rx="10" fill="#f5f9ff" stroke="#2563eb" stroke-width="1.2"/><text x="70" y="129.0" font-size="13" font-weight="800" fill="#2563eb" text-anchor="middle">Company</text><text x="70" y="146.0" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">(MAH / applicant)</text><rect x="20" y="210" width="920" height="138" rx="10" fill="#f8f5ff" stroke="#7c3aed" stroke-width="1.2"/><text x="70" y="275.0" font-size="13" font-weight="800" fill="#7c3aed" text-anchor="middle">Regulator</text><text x="70" y="292.0" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">(health authority)</text><rect x="20" y="356" width="920" height="138" rx="10" fill="#f4fbf6" stroke="#16a34a" stroke-width="1.2"/><text x="70" y="421.0" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">Repository</text><text x="70" y="438.0" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="middle">&amp; consumers</text><rect x="134" y="81.0" width="112" height="104" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="150" cy="98.0" r="10" fill="#2563eb"/><text x="150" y="102.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="164" y="102.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Author</text><text x="190.0" y="123.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">national template</text><text x="190.0" y="137.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">structured</text><text x="190.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">authoring tool</text><rect x="266" y="81.0" width="112" height="104" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="282" cy="98.0" r="10" fill="#2563eb"/><text x="282" y="102.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="296" y="102.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Submit draft</text><text x="322.0" y="123.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">annotated and</text><text x="322.0" y="137.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">clean versions</text><rect x="278.7" y="161.0" width="86.6" height="17" rx="9" fill="#fff" stroke="#d97706" stroke-width="1"/><text x="322.0" y="173.0" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">preliminary</text><rect x="398" y="227.0" width="112" height="104" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="414" cy="244.0" r="10" fill="#7c3aed"/><text x="414" y="248.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="428" y="248.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Review</text><text x="454.0" y="269.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">tracked changes</text><text x="454.0" y="283.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">comment threads</text><text x="454.0" y="297.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">diff vs approved</text><rect x="530" y="81.0" width="112" height="104" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="546" cy="98.0" r="10" fill="#2563eb"/><text x="546" y="102.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="560" y="102.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Respond</text><text x="586.0" y="123.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">accept or reject</text><text x="586.0" y="137.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">changes, reply,</text><text x="586.0" y="151.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">new draft version</text><rect x="542.7" y="161.0" width="86.6" height="17" rx="9" fill="#fff" stroke="#d97706" stroke-width="1"/><text x="586.0" y="173.0" font-size="10" font-weight="700" fill="#d97706" text-anchor="middle">preliminary</text><rect x="662" y="227.0" width="112" height="104" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><circle cx="678" cy="244.0" r="10" fill="#7c3aed"/><text x="678" y="248.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="692" y="248.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Approve</text><text x="718.0" y="269.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">regulator is</text><text x="718.0" y="283.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">the attester</text><rect x="694.5" y="307.0" width="47.0" height="17" rx="9" fill="#fff" stroke="#16a34a" stroke-width="1"/><text x="718.0" y="319.0" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">final</text><rect x="662" y="373.0" width="112" height="104" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="678" cy="390.0" r="10" fill="#16a34a"/><text x="678" y="394.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="692" y="394.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Publish</text><text x="718.0" y="415.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">FHIR repository</text><text x="718.0" y="429.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">List of ePIs</text><rect x="794" y="373.0" width="112" height="104" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="810" cy="390.0" r="10" fill="#16a34a"/><text x="810" y="394.0" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="824" y="394.0" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Reuse</text><text x="850.0" y="415.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">EMR, ePrescribing</text><text x="850.0" y="429.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">patient apps</text><text x="850.0" y="443.0" font-size="10.5" font-weight="400" fill="#475569" text-anchor="middle">pack artwork</text><path d="M 246 133.0 L 266 133.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/><path d="M 378 133.0 L 454.0 133.0 L 454.0 225.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/><path d="M 510 279.0 L 586.0 279.0 L 586.0 187.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mv)"/><text x="618.0" y="273.0" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">comments</text><path d="M 530 111.0 L 472.0 111.0 L 472.0 225.0" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mb)"/><text x="500.0" y="105.0" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">resubmit</text><path d="M 642 133.0 L 718.0 133.0 L 718.0 225.0" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#mb)"/><text x="692.0" y="127.0" font-size="10.5" font-weight="600" fill="#2563eb" text-anchor="middle">agreed</text><path d="M 718.0 331.0 L 718.0 371.0" fill="none" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#mv)"/><text x="746.0" y="356.0" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">publish</text><path d="M 774 425.0 L 794 425.0" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#mg)"/><path d="M 850.0 477.0 L 850.0 520 L 190.0 520 L 190.0 187.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ma)"/><text x="520.0" y="536" font-size="11" font-weight="600" fill="#d97706" text-anchor="middle">Variation or safety update: a new draft is derived-from the approved ePI, and the cycle repeats</text></svg>