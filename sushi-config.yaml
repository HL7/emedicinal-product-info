id: hl7.fhir.uv.emedicinal-product-info
canonical: http://hl7.org/fhir/uv/emedicinal-product-info 
name: EpiIG
title: Global Core Electronic Medicinal Product Information (ePI)
description: FHIR Implementation Guide representing how to create Electronic Medicinal Product Information (also known as drug poduct labels, summary of product characteristics, patient leaflet, and pack artwork).
status: active
version: 1.1.0
fhirVersion: 5.0.0
copyrightYear: 2022+
releaseLabel: trial-use
license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#001 "World" # https://www.hl7.org/fhir/valueset-jurisdiction.html
publisher:
  name: HL7 International / Biomedical Research and Regulation
  url: http://www.hl7.org/Special/committees/rcrim

extension:
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-wg
    valueCode: brr
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-standards-status
    valueCode: trial-use
  - url: http://hl7.org/fhir/StructureDefinition/structuredefinition-fmm
    valueInteger: 2

# textLink (narrative-to-data linking, ePI Type 4) is first published in the 5.4.0 extensions pack
dependencies:
  hl7.fhir.uv.extensions.r5: 5.4.0


# Annotated XML templates (generated by scripts/build_templates.py from the WonderDrug examples)
resources:
  Bundle/template-epi-type1:
    name: ePI Type 1 Template
    description: Annotated XML template for an ePI Type 1 (digital label) Bundle, with a comment before every element.
    exampleCanonical: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/Bundle-uv-epi
  Bundle/template-epi-type2:
    name: ePI Type 2 Template
    description: Annotated XML template for an ePI Type 2 (product data) Bundle, with a comment before every element.
    exampleCanonical: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/bundle-epi-type2
  Bundle/template-epi-type3:
    name: ePI Type 3 Template
    description: Annotated XML template for an ePI Type 3 (clinical data) Bundle, with a comment before every element.
    exampleCanonical: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/bundle-epi-type3
  Bundle/bundle-epi-type4-example-wonderdrug:
    name: ePI Type 4 Example - WonderDrug 500 mg tablets
    description: ePI Type 4 (dynamic digital label) example. It validates against the Type 3 Bundle profile and adds granular sub-sections, a section.entry on every content section, and span ids in the narrative linked to the structured resources with the textLink extension.
    exampleCanonical: http://hl7.org/fhir/uv/emedicinal-product-info/StructureDefinition/bundle-epi-type3

